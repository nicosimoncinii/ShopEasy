<div class="register-page">
    <div class="register-card">
      <h2>{{ langService.traduci('REGISTERTITOLO') }}</h2>
  
      @if (errore()) {
        <div class="errore">{{ errore() }}</div>
      }
  
      <div class="form-row">
        <div class="form-group">
          <label>{{ langService.traduci('NOME') }}</label>
          <input type="text" [(ngModel)]="nome" [placeholder]="langService.traduci('NOME')" />
        </div>
        <div class="form-group">
          <label>{{ langService.traduci('COGNOME') }}</label>
          <input type="text" [(ngModel)]="cognome" [placeholder]="langService.traduci('COGNOME')" />
        </div>
      </div>
  
      <div class="form-group">
        <label>{{ langService.traduci('EMAIL') }}</label>
        <input type="email" [(ngModel)]="email" [placeholder]="langService.traduci('EMAIL')" />
      </div>
  
      <div class="form-row">
        <div class="form-group">
          <label>{{ langService.traduci('PASSWORD') }}</label>
          <input type="password" [(ngModel)]="password" [placeholder]="langService.traduci('PASSWORD')" />
        </div>
        <div class="form-group">
          <label>{{ langService.traduci('CONFERMAPASSWORD') }}</label>
          <input type="password" [(ngModel)]="confermaPassword" [placeholder]="langService.traduci('CONFERMAPASSWORD')" />
        </div>
      </div>
  
      <button class="register-btn" (click)="onRegister()" [disabled]="caricamento()">
        @if (caricamento()) {
          Caricamento...
        } @else {
          {{ langService.traduci('REGISTRATI') }}
        }
      </button>
  
      <button class="login-link" (click)="goToLogin()">
        {{ langService.traduci('HAIACCOUNT') }}
      </button>
  
      <button class="back-btn" (click)="goBack()">
        {{ langService.traduci('TORNA') }}
      </button>
    </div>
  </div>

<div class="login-page">
  <div class="login-card">
    <h2>{{ langService.traduci('RIPRISTINA_PASSWORD') || 'Ripristina Password' }}</h2>

    @if (messaggioErrore) {
      <div class="error" style="color: red; margin-bottom: 15px; font-weight: bold;">
        {{ messaggioErrore }}
      </div>
    }
    
    @if (messaggioSuccesso) {
      <div class="success" style="color: green; margin-bottom: 15px; font-weight: bold;">
        {{ messaggioSuccesso }}
      </div>
    }

    <div class="form-group">
      <label>EMAIL</label>
      <input 
        type="email" 
        [(ngModel)]="email" 
        name="email" 
        placeholder="Inserisci la tua email" 
        [disabled]="isCaricamento"
      />
    </div>

    <button 
      class="login-btn" 
      (click)="onInvia()" 
      [disabled]="isCaricamento && !messaggioSuccesso"
    >
      @if (isCaricamento && !messaggioSuccesso) {
        Caricamento...
      } @else {
        {{ langService.traduci('INVIA') || 'Invia' }}
      }
    </button>

    <div class="actions">
      <button class="back-home-btn" (click)="tornaAlLogin()">
        Torna al login
      </button>
    </div>
  </div>
</div>

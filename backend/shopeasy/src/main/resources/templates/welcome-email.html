<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
    </head>
    <body style="margin: 0; padding: 0; font-family: 'Inter', Helvetica, Arial, sans-serif; background-color: #F0F0F0; color: #3A3A3A;">
        <div style="max-width: 600px; margin: 20px auto; background-color: #F7F7F7; border: 1px solid #E3F2FF; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);">

            <div style="background-color: #bed4f3; padding: 30px; text-align: center;">
                <h1 style="margin: 0; color: #4A4A4A; font-size: 24px; font-weight: 700;" th:text="${nomeBrand}">NOMEBRAND</h1>
            </div>
            <div style="padding: 30px; line-height: 1.6;">
                <h2 style="color: #4A4A4A; font-size: 18px; margin-top: 0;">
                    <span th:text="${salutoIniziale}">Ciao</span> <span th:text="${nomeUtente}">Utente</span>,
                </h2>

                <p th:utext="${messaggioPrincipale}" style="margin-bottom: 15px;"></p>
                <p th:text="${messaggioAzione}" style="margin-bottom: 15px;"></p>

                <div style="text-align: center; margin: 30px 0;">
                    <a th:href="${linkBottone}"
                       style="background-color: #C8F3DF; color: #2E2E2E !important; text-decoration: none; padding: 12px 25px; border-radius: 8px; font-weight: 600; display: inline-block;"
                       th:text="${testoBottone}">Bottone</a>
                </div>

                <p th:utext="${messaggioAssistenza}" style="margin-bottom: 15px;"></p>
                <p th:text="${salutoFinale}" style="margin-bottom: 15px;"></p>
            </div>
            <div style="background-color: #E3F2FF; padding: 20px; text-align: center; font-size: 12px; color: #8A8A8A; border-top: 1px solid #bed4f3;">
                <p style="margin: 5px 0;" th:text="${testoCopyright}"></p>
                <p style="margin: 5px 0;" th:text="${notaFooter}"></p>
            </div>
        </div>
    </body>
</html>

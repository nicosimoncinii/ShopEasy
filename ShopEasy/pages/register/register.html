<div class="register-page">
    <div class="register-card">

        <h2>{{ langService.traduci('REGISTERTITOLO') }}</h2>

        <div class="form-row">
            <div class="form-group">
                <label>{{ langService.traduci('NOME') }}</label>
                <input type="text" [placeholder]="langService.traduci('NOME')" />
            </div>

            <div class="form-group">
                <label>{{ langService.traduci('COGNOME') }}</label>
                <input type="text" [placeholder]="langService.traduci('COGNOME')" />
            </div>
        </div>

        <div class="form-group">
            <label>{{ langService.traduci('EMAIL') }}</label>
            <input type="email" [placeholder]="langService.traduci('EMAIL')" />
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>{{ langService.traduci('PASSWORD') }}</label>
                <input type="password" [placeholder]="langService.traduci('PASSWORD')" />
            </div>

            <div class="form-group">
                <label>{{ langService.traduci('CONFERMAPASSWORD') }}</label>
                <input type="password" [placeholder]="langService.traduci('CONFERMAPASSWORD')" />
            </div>
        </div>

        <button class="register-btn" (click)="onRegister()">
            {{ langService.traduci('REGISTRATI') }}
        </button>

        <button class="login-link" (click)="goToLogin()">
            {{ langService.traduci('HAIACCOUNT') }}
        </button>

        <button class="back-btn" (click)="goBack()">
            {{ langService.traduci('TORNA') }}
        </button>

    </div>
</div>

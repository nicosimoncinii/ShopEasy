<div class="product-list-container">
  <div class="filters-bar">
    <div class="filters-left">
      <select><option>Prezzo</option></select>
      <select><option>Modello</option></select>
      <select><option>Anno di produzione</option></select>
      <select><option>Dimensione schermo</option></select>
      <select><option>Memoria (GB)</option></select>
      <select><option>Filtri</option></select>
    </div>
    <div class="filters-right">
      <select><option>Ordina: Best seller</option></select>
    </div>
  </div>

  <div class="products-grid">
    <app-product-card *ngFor="let product of products" [product]="product"></app-product-card>
  </div>
</div>

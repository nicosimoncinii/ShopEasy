<div class="product-list-container">
    <div class="products-grid">
        <app-product-card
                *ngFor="let product of products"
                [product]="product"
                [isInWishlist]="wishlistService.isInWishlist(product.id)"
                (aggiungiAlCarrello)="onAggiungiAlCarrello(product)"
                (toggleWishlist)="onToggleWishlist(product)"
                (nonLoggato)="mostraModale = true">
        </app-product-card>
    </div>
</div>

<app-modal-login
        *ngIf="mostraModale"
        (chiudi)="mostraModale = false">
</app-modal-login>

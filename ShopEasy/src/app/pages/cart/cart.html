@if (cartService.scelti.length > 0) {
    <h1>Hai {{ cartService.scelti.length }} prodotti nel carrello!</h1>
    @for (prodotto of cartService.scelti; track $index; let i = $index) {
      <div>
        <span>{{ prodotto.nome }} - {{ prodotto.prezzo }}€</span>
        <button (click)="cartService.rimuovi(i)">Rimuovi</button>
      </div>
    }
  } @else {
    <h1>Il carrello è vuoto</h1>
  }

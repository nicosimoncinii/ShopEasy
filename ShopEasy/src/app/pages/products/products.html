<div class="products-page">
  <h2>{{ traduzioni.prodottiTitolo }}</h2>
  <div class="products-list">
    @if (prodottiVisualizzati.length > 0) {
      @for (prodotto of prodottiVisualizzati; track prodotto.id) {
        <div class="product-row">
          <div class="product-info">
            <strong>{{ prodotto.nome }}</strong>
            <span class="product-price">{{ prodotto.prezzo }}€</span>
          </div>
          <button class="add-to-cart-btn" (click)="aggiungiAlCarrello(prodotto)">
            {{ traduzioni.aggiungi }}
          </button>
        </div>
      }
    } @else {
      <p class="no-results">{{ traduzioni.nessunProdotto }}</p>
    }
  </div>
</div>
